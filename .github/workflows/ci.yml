name: ML service checks

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run integration tests
        run: python -m unittest discover -s tests -v

      - name: Build Docker image
        run: docker build -t maintenance-ml .

      - name: Start container
        run: |
          docker run -d --name maintenance-api \
            -p 127.0.0.1:8000:8000 maintenance-ml

      - name: Verify container API
        shell: python
        run: |
          import time
          import httpx

          with httpx.Client(
              base_url="http://127.0.0.1:8000",
              timeout=5,
              trust_env=False,
          ) as client:
              for attempt in range(30):
                  try:
                      response = client.get("/health")
                      response.raise_for_status()
                      assert response.json()["model_version"] == "v1"
                      break
                  except (httpx.HTTPError, AssertionError, KeyError):
                      time.sleep(1)
              else:
                  raise RuntimeError("Container did not become healthy")

              response = client.post("/predict", json={
                  "temperature_c": 75,
                  "vibration_mm_s": 3,
                  "rpm": 1500,
                  "tool_wear_min": 110,
              })
              response.raise_for_status()
              result = response.json()
              assert result["model_version"] == "v1"
              assert 0 <= result["failure_probability"] <= 1
              assert isinstance(result["maintenance_alert"], bool)
              assert result["request_id"]
              print("Container prediction verified:", result)

              response = client.get("/metrics")
              response.raise_for_status()
              assert response.json()["successful_predictions"] == 1
              print("Prediction logging verified")

      - name: Show container logs
        if: always()
        run: docker logs maintenance-api || true

      - name: Remove container
        if: always()
        run: docker rm -f maintenance-api || true
