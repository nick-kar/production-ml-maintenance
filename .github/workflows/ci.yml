name: ML service checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run integration tests
        run: python -m unittest discover -s tests -v
      - name: Build Docker image
        run: docker build -t maintenance-ml .
      - name: Verify container persistence, release and rollback
        run: python -m scripts.container_check
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-verification
          path: |
            container-check.json
            container-logs.txt
